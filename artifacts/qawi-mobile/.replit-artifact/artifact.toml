kind = "mobile"
previewPath = "/mobile/"
title = "Qawi Mobile"
version = "1.0.0"
id = "artifacts/qawi-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/mobile/" ]
localPort = 26104

[services.development]
run = "pnpm --filter @workspace/qawi-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qawi-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/qawi-mobile", "run", "serve" ]

[services.env]
PORT = "26104"
BASE_PATH = "/mobile/"
