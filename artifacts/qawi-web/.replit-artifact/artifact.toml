kind = "web"
previewPath = "/"
title = "Qawi Gym Management"
version = "1.0.0"
id = "artifacts/qawi-web"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26077

[services.development]
run = "pnpm --filter @workspace/qawi-web run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/qawi-web", "run", "build" ]
publicDir = "artifacts/qawi-web/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26077"
BASE_PATH = "/"

[[services]]
name = "qawi-spring-api"
paths = [ "/api/v1" ]
localPort = 9000

[services.development]
run = "echo 'Qawi Spring Boot API is managed by the Qawi Spring Boot API workflow'"
