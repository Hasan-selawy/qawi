<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A0F1E"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="greenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22C55E" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#22C55E" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <clipPath id="round"><rect width="900" height="620" rx="20"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="900" height="620" rx="20" fill="url(#bgGrad)"/>
  <rect width="900" height="620" rx="20" fill="url(#greenGlow)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="3" rx="1.5" fill="#22C55E"/>

  <!-- Header -->
  <text x="52" y="54" fill="#22C55E" font-size="11" font-weight="700" letter-spacing="4" text-anchor="start">QAWI GYM MANAGEMENT</text>
  <text x="52" y="84" fill="#FFFFFF" font-size="26" font-weight="700" letter-spacing="-0.5">Brand Color Palette</text>
  <text x="52" y="108" fill="#64748B" font-size="13">Official colors for web, mobile, and print applications</text>

  <!-- Divider -->
  <rect x="52" y="124" width="796" height="1" fill="#1E293B"/>

  <!-- ═══════════════ ROW 1: Backgrounds ═══════════════ -->
  <text x="52" y="160" fill="#64748B" font-size="10" font-weight="600" letter-spacing="3">BACKGROUNDS</text>

  <!-- Swatch 1: Deep Space -->
  <rect x="52" y="172" width="170" height="100" rx="12" fill="#0A0F1E" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
  <rect x="52" y="172" width="170" height="100" rx="12" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="139" y="228" fill="#64748B" font-size="15" font-weight="700" text-anchor="middle">Aa</text>
  <text x="139" y="254" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Deep Space</text>
  <text x="139" y="270" fill="#64748B" font-size="10" text-anchor="middle">#0A0F1E</text>

  <!-- Swatch 2: Midnight -->
  <rect x="238" y="172" width="170" height="100" rx="12" fill="#0F172A" filter="url(#shadow)"/>
  <rect x="238" y="172" width="170" height="100" rx="12" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="323" y="228" fill="#64748B" font-size="15" font-weight="700" text-anchor="middle">Aa</text>
  <text x="323" y="254" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Midnight</text>
  <text x="323" y="270" fill="#64748B" font-size="10" text-anchor="middle">#0F172A</text>

  <!-- Swatch 3: Slate Dark -->
  <rect x="424" y="172" width="170" height="100" rx="12" fill="#1E293B" filter="url(#shadow)"/>
  <rect x="424" y="172" width="170" height="100" rx="12" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="509" y="228" fill="#94A3B8" font-size="15" font-weight="700" text-anchor="middle">Aa</text>
  <text x="509" y="254" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Slate Dark</text>
  <text x="509" y="270" fill="#94A3B8" font-size="10" text-anchor="middle">#1E293B</text>

  <!-- Swatch 4: Slate Border -->
  <rect x="610" y="172" width="238" height="100" rx="12" fill="#334155" filter="url(#shadow)"/>
  <rect x="610" y="172" width="238" height="100" rx="12" fill="none" stroke="#475569" stroke-width="1"/>
  <text x="729" y="228" fill="#94A3B8" font-size="15" font-weight="700" text-anchor="middle">Aa</text>
  <text x="729" y="254" fill="#FFFFFF" font-size="11" font-weight="600" text-anchor="middle">Slate Border</text>
  <text x="729" y="270" fill="#94A3B8" font-size="10" text-anchor="middle">#334155</text>

  <!-- ═══════════════ ROW 2: Brand Green ═══════════════ -->
  <text x="52" y="310" fill="#64748B" font-size="10" font-weight="600" letter-spacing="3">PRIMARY — ENERGY GREEN</text>

  <!-- Swatch: Energy Green (wide primary) -->
  <rect x="52" y="322" width="356" height="110" rx="12" fill="#22C55E" filter="url(#shadow)"/>
  <text x="230" y="368" fill="#0A0F1E" font-size="13" font-weight="700" text-anchor="middle">PRIMARY</text>
  <text x="230" y="390" fill="#0A0F1E" font-size="22" font-weight="800" text-anchor="middle">Energy Green</text>
  <text x="230" y="415" fill="#15803D" font-size="12" font-weight="600" text-anchor="middle">#22C55E · RGB(34, 197, 94)</text>

  <!-- Swatch: Forest Green -->
  <rect x="424" y="322" width="170" height="110" rx="12" fill="#16A34A" filter="url(#shadow)"/>
  <text x="509" y="372" fill="#DCFCE7" font-size="11" font-weight="600" text-anchor="middle">Hover / Active</text>
  <text x="509" y="393" fill="#FFFFFF" font-size="14" font-weight="700" text-anchor="middle">Forest Green</text>
  <text x="509" y="414" fill="#DCFCE7" font-size="10" text-anchor="middle">#16A34A</text>

  <!-- Swatch: Mint -->
  <rect x="610" y="322" width="238" height="110" rx="12" fill="#DCFCE7" filter="url(#shadow)"/>
  <text x="729" y="372" fill="#15803D" font-size="11" font-weight="600" text-anchor="middle">Success / Badge</text>
  <text x="729" y="393" fill="#14532D" font-size="14" font-weight="700" text-anchor="middle">Mint</text>
  <text x="729" y="414" fill="#15803D" font-size="10" text-anchor="middle">#DCFCE7</text>

  <!-- ═══════════════ ROW 3: Text ═══════════════ -->
  <text x="52" y="474" fill="#64748B" font-size="10" font-weight="600" letter-spacing="3">TEXT &amp; ICONS</text>

  <rect x="52" y="486" width="108" height="90" rx="12" fill="#FFFFFF" filter="url(#shadow)"/>
  <text x="106" y="528" fill="#0A0F1E" font-size="20" font-weight="800" text-anchor="middle">Aa</text>
  <text x="106" y="552" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Pure White</text>
  <text x="106" y="567" fill="#94A3B8" font-size="10" text-anchor="middle">#FFFFFF</text>

  <rect x="172" y="486" width="108" height="90" rx="12" fill="#F1F5F9" filter="url(#shadow)"/>
  <text x="226" y="528" fill="#0A0F1E" font-size="20" font-weight="800" text-anchor="middle">Aa</text>
  <text x="226" y="552" fill="#334155" font-size="10" font-weight="600" text-anchor="middle">Off White</text>
  <text x="226" y="567" fill="#94A3B8" font-size="10" text-anchor="middle">#F1F5F9</text>

  <rect x="292" y="486" width="108" height="90" rx="12" fill="#94A3B8" filter="url(#shadow)"/>
  <text x="346" y="528" fill="#0A0F1E" font-size="20" font-weight="800" text-anchor="middle">Aa</text>
  <text x="346" y="552" fill="#0F172A" font-size="10" font-weight="600" text-anchor="middle">Silver</text>
  <text x="346" y="567" fill="#1E293B" font-size="10" text-anchor="middle">#94A3B8</text>

  <rect x="412" y="486" width="108" height="90" rx="12" fill="#64748B" filter="url(#shadow)"/>
  <text x="466" y="528" fill="#FFFFFF" font-size="20" font-weight="800" text-anchor="middle">Aa</text>
  <text x="466" y="552" fill="#F1F5F9" font-size="10" font-weight="600" text-anchor="middle">Steel</text>
  <text x="466" y="567" fill="#CBD5E1" font-size="10" text-anchor="middle">#64748B</text>

  <!-- ═══════════════ SEMANTIC ═══════════════ -->
  <rect x="532" y="486" width="108" height="90" rx="12" fill="#EF4444" filter="url(#shadow)"/>
  <text x="586" y="524" fill="#FFFFFF" font-size="17" font-weight="800" text-anchor="middle">✕</text>
  <text x="586" y="548" fill="#FEE2E2" font-size="10" font-weight="600" text-anchor="middle">Alert Red</text>
  <text x="586" y="563" fill="#FEE2E2" font-size="10" text-anchor="middle">#EF4444</text>

  <rect x="652" y="486" width="108" height="90" rx="12" fill="#F59E0B" filter="url(#shadow)"/>
  <text x="706" y="524" fill="#FFFFFF" font-size="17" font-weight="800" text-anchor="middle">⚠</text>
  <text x="706" y="548" fill="#FEF3C7" font-size="10" font-weight="600" text-anchor="middle">Amber</text>
  <text x="706" y="563" fill="#FEF3C7" font-size="10" text-anchor="middle">#F59E0B</text>

  <rect x="772" y="486" width="76" height="90" rx="12" fill="#3B82F6" filter="url(#shadow)"/>
  <text x="810" y="524" fill="#FFFFFF" font-size="17" font-weight="800" text-anchor="middle">ℹ</text>
  <text x="810" y="548" fill="#DBEAFE" font-size="10" font-weight="600" text-anchor="middle">Info Blue</text>
  <text x="810" y="563" fill="#DBEAFE" font-size="10" text-anchor="middle">#3B82F6</text>

  <!-- Footer -->
  <text x="52" y="606" fill="#334155" font-size="10" text-anchor="start">© Qawi Gym Management · Brand Guidelines 2025</text>
  <text x="848" y="606" fill="#22C55E" font-size="10" font-weight="600" text-anchor="end">قوي</text>
</svg>
