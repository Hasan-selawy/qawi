services:
  postgres:
    image: postgres:15-alpine
    container_name: qawi-db
    environment:
      POSTGRES_DB: qawi
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qawi_local_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d qawi"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./qawi-backend
    container_name: qawi-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/qawi
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-qawi_local_password}
      JWT_SECRET: ${JWT_SECRET:?Set a unique JWT_SECRET of at least 32 bytes}
      SPRING_PROFILES_ACTIVE: prod
      QAWI_NOTIFICATIONS_JOBS_ENABLED: "false"
    ports:
      - "9000:9000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: artifacts/qawi-web/Dockerfile
      args:
        VITE_API_URL: ""
    container_name: qawi-web
    ports:
      - "5000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
