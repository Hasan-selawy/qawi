name: Security

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "qawi-backend/pom.xml"

jobs:
  dependency-check:
    name: OWASP Dependency-Check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 19
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "19"
          cache: maven
      - name: Run OWASP Dependency-Check
        working-directory: qawi-backend
        env:
          # Optional but strongly recommended — greatly speeds up the NVD feed.
          # Add NVD_API_KEY as a repository secret (https://nvd.nist.gov/developers/request-an-api-key).
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B -ntp org.owasp:dependency-check-maven:check -DnvdApiKey="$NVD_API_KEY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: qawi-backend/target/dependency-check-report.*
          if-no-files-found: ignore
