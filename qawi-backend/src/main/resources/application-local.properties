spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/qawi}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:qawi_local_password}

app.jwt.secret=${JWT_SECRET:qawi-local-development-secret-change-before-production}
qawi.notifications.jobs.enabled=false

logging.level.com.qawi=DEBUG

# Explicit opt-in for local demo data only.
qawi.seed.enabled=${QAWI_SEED:false}
