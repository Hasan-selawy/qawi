spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
server.forward-headers-strategy=none
qawi.seed.enabled=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=${PORT:9000}

# JWT signing secret. MUST be set via env var in any non-dev environment.
# Local development has a separate explicit profile. No shared-secret fallback here.
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=604800000

# Actuator — expose health endpoint publicly; all others require SUPER_ADMIN
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.info.env.enabled=true

# Logging — appenders/format are configured in logback-spring.xml: a readable
# console by default, structured JSON under the 'prod' or 'json-logging' profile.
logging.level.com.qawi=INFO

# Notification automatic jobs (set to false to disable all scheduled notification jobs)
qawi.notifications.jobs.enabled=true

# The contract endpoint is restricted to SUPER_ADMIN by Spring Security.
springdoc.paths-to-match=/api/v1/**
springdoc.api-docs.version=openapi_3_0
springdoc.writer-with-order-by-keys=true

# Monitoring is opt-in. The reporter sends sanitized code locations, not request/domain data.
qawi.observability.sentry-dsn=${SENTRY_DSN:}
qawi.observability.environment=${SENTRY_ENVIRONMENT:production}

# No statutory retention period is assumed. Set policy, rehearse dry-run, then explicitly enable deletion.
qawi.privacy.retention.enabled=${QAWI_RETENTION_ENABLED:false}
qawi.privacy.retention.dry-run=${QAWI_RETENTION_DRY_RUN:true}
qawi.privacy.measurement-retention-days=${QAWI_MEASUREMENT_RETENTION_DAYS:0}
qawi.privacy.biometric-retention-days=${QAWI_BIOMETRIC_RETENTION_DAYS:0}
qawi.attendance.max-offline-days=7
