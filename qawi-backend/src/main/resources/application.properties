spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=9000

# JWT signing secret. MUST be set via env var in any non-dev environment.
# Falls back to SESSION_SECRET in dev so the app still boots without a separate secret.
app.jwt.secret=${JWT_SECRET:${SESSION_SECRET:}}
app.jwt.expiration-ms=604800000
