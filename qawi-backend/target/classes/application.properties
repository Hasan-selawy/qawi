spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

server.port=9000

# JWT signing secret. MUST be set via env var in any non-dev environment.
# Falls back to SESSION_SECRET in dev so the app still boots without a separate secret.
app.jwt.secret=${JWT_SECRET:${SESSION_SECRET:}}
app.jwt.expiration-ms=604800000

# Actuator — expose health endpoint publicly; all others require SUPER_ADMIN
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=always
management.info.env.enabled=true

# Logging — appenders/format are configured in logback-spring.xml: a readable
# console by default, structured JSON under the 'prod' or 'json-logging' profile.
logging.level.com.qawi=INFO

# Notification automatic jobs (set to false to disable all scheduled notification jobs)
qawi.notifications.jobs.enabled=true
